#     url: str             # canonical URL
#     source_type: str     # html | pdf | csv | json | ...
#     license: str         # public-domain | CC | open | unknown
#     tags: [str, ...]     # optional taxonomy tags
#     ingest_type: crawl   # crawl (auto) | upload (manual bulk file)
#     crawl_config: {}     # optional crawler overrides
#     crawl_schedule: null # optional 5-field UTC cron string
#
# --- Live re-verification notes (24-01 Task 3, re-checked at execution time,
#     not trusted from RESEARCH.md's 2026-07-21 baseline alone) ---
#
# CISA Guidelines for Secure AI System Development: DROPPED. Live re-check at
# execution time reproduced the documented HTTP 403 on both the resource page
# and /robots.txt (Akamai edge "Access Denied" block, independent of
# User-Agent) — durable bot-mitigation posture, not a transient sandbox
# condition. No replacement source substituted per D-02's own instruction not
# to add a replacement without a fresh, explicit decision.
#
# NIST AI RMF 1.0: the HTML landing page (nist.gov/itl/ai-risk-management-framework)
# is live (HTTP 200) but, after live inspection, is a short overview/portal page
# (~7KB of visible text after nav-menu boilerplate is stripped) that links to
# the actual framework rather than reproducing its content — judged NOT
# substantively representative of the full AI RMF document. Registered as an
# upload-type entry against the canonical PDF instead (matches NIST AI 600-1's
# treatment) — a second, independently-discovered/documented PDF-only source.
#
# MCP specification: modelcontextprotocol.io/specification/ 302-redirects (live,
# at execution time) to a dated version path; source_url below is the
# redirect target so the registered Source and the crawled page match exactly.
#
# IETF RFC 6749: using the direct .html rendering (not the bare /rfc/rfc6749
# path, which redirects to an /info/ page) so no redirect hop is needed and
# the full RFC text is the crawled content (verified: contains the RFC's own
# table of contents and section text, not just a metadata summary).

